name: shelf
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Deploy key for private books
        env:
          KEY: ${{ secrets.SHELF_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/shelf_key"
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/shelf_key"
            echo "SHELF_KEY=$RUNNER_TEMP/shelf_key" >> "$GITHUB_ENV"
          fi
      - run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with: {path: out}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
