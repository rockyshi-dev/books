name: shelf
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with: {path: out}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
